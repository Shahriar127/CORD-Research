name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests sim experiments
          ruff format --check src tests sim experiments
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Synthetic studies (quick)
        run: |
          python sim/s1_selections.py --scale 0.05 --out /tmp/sim
          python sim/s2_presence_contamination.py --scale 0.05 --out /tmp/sim
