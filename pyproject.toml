[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cord-backdoor"
version = "0.1.0"
description = "CORD: conformal evidence fusion for detecting backdoor poison with presence testing, FDR control and detection floors."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Md. Shahriar Jubair Mahim" }]
license = { text = "MIT" }
keywords = ["backdoor", "data poisoning", "conformal inference", "false discovery rate", "e-values"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.3",  # torch.amp.GradScaler("cuda")
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
cord = "cord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running statistical or end-to-end tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "sim", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT", "C4", "PIE", "RET"]
# math-style names (X, N, K), unicode in docstrings, and the `torch.nn.functional as F` convention
ignore = ["N803", "N806", "N812", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.10"
packages = ["cord"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
